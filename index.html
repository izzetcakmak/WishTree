        let currentAccount = "";

        async function connectWallet() {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                currentAccount = accounts[0];
                document.getElementById('status').innerText = "Bağlandı: " + currentAccount.substring(0,6) + "...";
                checkOwner();
                loadWishes();
            }
        }

        async function checkOwner() {
            const provider = new ethers.providers.JsonRpcProvider("https://rpc.testnet.arc.network");
            const contract = new ethers.Contract(contractAddress, abi, provider);
            try {
                const owner = await contract.owner();
                const balance = await provider.getBalance(contractAddress);
                
                if(currentAccount.toLowerCase() === owner.toLowerCase()) {
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('contractBalance').innerText = ethers.utils.formatEther(balance);
                }
            } catch(e) { console.error("Sahip kontrolü hatası:", e); }
        }

        async function loadWishes() {
    try {
        const provider = new ethers.providers.JsonRpcProvider("https://rpc.testnet.arc.network");
        const contract = new ethers.Contract(contractAddress, abi, provider);
        
        // Kontrattan veriyi çekiyoruz
        const wishes = await contract.getAllWishes();
        
        let html = "";
        
        // Eğer veriler dizi (array) olarak geliyorsa işle
        if (wishes && wishes.length > 0) {
            // Verileri tersten (en yeni en üstte) listele
            wishes.slice().reverse().forEach(w => {
                html += `
                    <div class="wish-card">
                        <span class="nft-badge">NFT ID: #${w.nftId.toString()}</span>
                        <small>Gönderen: ${w.sender.substring(0,10)}...</small><br>
                        <strong>"${w.message}"</strong>
                    </div>`;
            });
            document.getElementById('listContent').innerHTML = html;
        } else {
            document.getElementById('listContent').innerHTML = "Henüz kaydedilmiş bir dilek yok.";
        }
    } catch (e) { 
        console.error("Listeleme Hatası:", e);
        document.getElementById('listContent').innerHTML = "Veriler şu an yüklenemiyor. Lütfen sayfayı yenileyin.";
    }
}

        async function sendWish() {
            const msg = document.getElementById('wishInput').value;
            if(!msg) return alert("Dilek yazmalısın!");
            
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();
            const contract = new ethers.Contract(contractAddress, abi, signer);

            try {
                document.getElementById('status').innerText = "İşlem gönderiliyor...";
                const tx = await contract.makeAWish(msg, {
                    value: ethers.utils.parseUnits("0.01", 18),
                    gasLimit: 500000
                });
                document.getElementById('status').innerText = "Blok onayı bekleniyor...";
                await tx.wait();
                alert("Başarılı! Artık Arc Scan'de bir NFT koleksiyonun var!");
                location.reload();
            } catch (err) { 
                console.error(err);
                alert("Hata: " + err.message); 
            }
        }

        async function withdrawFunds() {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            const signer = provider.getSigner();
            const contract = new ethers.Contract(contractAddress, abi, signer);
            try {
                const tx = await contract.withdraw();
                await tx.wait();
                alert("Kasa başarıyla boşaltıldı!");
                location.reload();
            } catch (err) { alert(err.message); }
        }

       window.onload = function() {
            loadWishes();
            // Sayfa açıldığında kaydedilmiş dili hatırla, yoksa 'tr' yap
            const savedLang = localStorage.getItem('selectedLang') || 'tr';
            changeLang(savedLang);
        };

        const translations = {
            tr: {
                title: "🌳 Arc Dilek Ağacı & NFT",
                subtitle: "Dileğini dile, 0.01 Arc ile Standart NFT'ni kazan!",
                placeholder: "Sonsuzluğa bir dilek bırak...",
                button: "Dilek Gönder & NFT Bas",
                history: "📜 Blokzincir Kayıtları (ERC-721)"
            },
            en: {
                title: "🌳 Arc Wish Tree & NFT",
                subtitle: "Make a wish, mint your Standard NFT for 0.01 Arc!",
                placeholder: "Leave a wish for eternity...",
                button: "Send Wish & Mint NFT",
                history: "📜 Blockchain Records (ERC-721)"
            }
        };

        function changeLang(lang) {
            // Yazıları güncelle
            document.querySelector('h1').innerText = translations[lang].title;
            document.querySelector('.container p').innerText = translations[lang].subtitle;
            document.getElementById('wishInput').placeholder = translations[lang].placeholder;
            
            // "Dilek Gönder" butonunu bul ve güncelle
            const wishBtn = document.querySelector('button[onclick="sendWish()"]');
            if(wishBtn) wishBtn.innerText = translations[lang].button;
            
            // Geçmiş başlığını güncelle
            document.querySelector('#wishesList h3').innerText = translations[lang].history;
            
            // Seçimi kaydet
            localStorage.setItem('selectedLang', lang);
            console.log("Dil değiştirildi: " + lang);
        }
    </script>
</body>
</html>
